# -----------------------------------------------------------------------------
# nginx server config for the n-rainhas SPA.
# Listens on 8080 so the container can run as the unprivileged 'nginx' user.
# -----------------------------------------------------------------------------

server {
  listen 8080 default_server;
  listen [::]:8080 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Disable directory listing.
  autoindex off;

  # Security headers.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options         "DENY" always;
  add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;

  # Hide nginx version banner.
  server_tokens off;

  # Gzip text payloads inline. Brotli is not in the base image; consumers can
  # add nginx-brotli if they need it.
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/xml+rss
    application/wasm
    image/svg+xml
    font/ttf
    font/otf
    font/woff
    font/woff2;

  # Long-cache hashed bundles (Angular emits hash suffixes in production).
  location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
    expires 1y;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Web Workers — same caching policy.
  location ~* \.worker\.js$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Never cache index.html so deploys are picked up immediately.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    expires off;
    try_files $uri =404;
  }

  # SPA fallback — every unknown route returns index.html so the Angular
  # router can take over.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Optional health probe used by Kubernetes liveness/readiness.
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }
}
