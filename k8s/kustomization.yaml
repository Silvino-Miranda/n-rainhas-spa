apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

# Override the image when deploying:
#   kustomize edit set image ghcr.io/silvino-miranda/n-rainhas-spa=ghcr.io/silvino-miranda/n-rainhas-spa:1.0.0
images:
  - name: ghcr.io/silvino-miranda/n-rainhas-spa
    newTag: latest

commonLabels:
  app.kubernetes.io/name: n-rainhas-spa
  app.kubernetes.io/managed-by: kustomize
