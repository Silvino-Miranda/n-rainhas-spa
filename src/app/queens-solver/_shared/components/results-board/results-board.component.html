<div class="board-container" *ngIf="solution">
  <h5>♛ Solução Encontrada</h5>
  <div class="stats">
    <span><strong>Rainhas:</strong> {{ queensCount }}</span>
    <span><strong>Algoritmo:</strong> {{ getAlgorithmLabel() }}</span>
    <span *ngIf="algorithmUsed === 'ga'"><strong>Gerações:</strong> {{ generations }}</span>
    <span *ngIf="algorithmUsed === 'nn' || algorithmUsed === 'brain'"><strong>Iterações:</strong> {{ iterations }}</span>
    <span><strong>Tempo:</strong> {{ solveTime }} ms</span>
  </div>

  <table class="chessboard">
    <tr *ngFor="let row of solution; let rowIndex = index">
      <td
        *ngFor="let cell of row; let colIndex = index"
        [class]="getCellClass(rowIndex, colIndex, cell)"
      ></td>
    </tr>
  </table>
</div>
