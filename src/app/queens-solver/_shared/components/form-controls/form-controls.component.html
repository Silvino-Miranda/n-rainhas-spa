<form class="queens-form" [formGroup]="form()">
  <label for="queensNumber">Número de rainhas:</label>
  <input type="number" id="queensNumber" class="form-control" formControlName="queensNumber" [min]="minQueens()"
    [max]="maxQueens()" />

  <button type="button" class="btn btn-primary" [disabled]="form().invalid || isLoading()" (click)="onBacktracking()">
    @if (!isLoading() || algorithmUsed() !== 'backtracking') {
    <span>Backtracking</span>
    }
    @if (isLoading() && algorithmUsed() === 'backtracking') {
    <span>Calculando...</span>
    }
  </button>

  <button type="button" class="btn btn-success" [disabled]="form().invalid || isLoading()" (click)="onGa()">
    @if (!isLoading() || algorithmUsed() !== 'ga') {
    <span>Algoritmo Genético</span>
    }
    @if (isLoading() && algorithmUsed() === 'ga') {
    <span>Evoluindo...</span>
    }
  </button>

  <button type="button" class="btn btn-warning" [disabled]="form().invalid || isLoading()" (click)="onNn()">
    @if (!isLoading() || algorithmUsed() !== 'nn') {
    <span>🧠 Rede Neural</span>
    }
    @if (isLoading() && algorithmUsed() === 'nn') {
    <span>Treinando...</span>
    }
  </button>

  <button type="button" class="btn btn-info" [disabled]="form().invalid || isLoading()" (click)="onBrain()">
    @if (!isLoading() || algorithmUsed() !== 'brain') {
    <span>🔵 Brain.js</span>
    }
    @if (isLoading() && algorithmUsed() === 'brain') {
    <span>Aprendendo...</span>
    }
  </button>

  @if (showEvolveFromSaved()) {
  <div class="form-check evolve-checkbox">
    <input class="form-check-input" type="checkbox" id="evolveFromSaved" [checked]="evolveFromSaved()"
      (change)="onToggleEvolve($event)" />
    <label class="form-check-label" for="evolveFromSaved">
      🧬 Evoluir a partir do melhor salvo
    </label>
  </div>
  }
</form>
