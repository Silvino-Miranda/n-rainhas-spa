<div class="container py-4">
  <h1 class="mb-4">♛ Problema das N-Rainhas</h1>

  <section>
    <app-qs-form-controls [form]="form" [isLoading]="isLoading" [algorithmUsed]="algorithmUsed" [minQueens]="MIN_QUEENS"
      [maxQueens]="MAX_QUEENS" [evolveFromSaved]="evolveFromSaved" [showEvolveFromSaved]="hasSavedResultForCurrentN()"
      (backtracking)="onSubmit()" (ga)="onSubmitGA()" (nn)="onSubmitNN()" (brain)="onSubmitBrain()"
      (evolveFromSavedChange)="evolveFromSaved = $event"></app-qs-form-controls>

    <div *ngIf="form.get('queensNumber')?.errors?.['min'] || form.get('queensNumber')?.errors?.['max']"
      class="text-danger mt-2">
      Por favor, insira um valor entre {{ MIN_QUEENS }} e {{ MAX_QUEENS }}.
    </div>
  </section>

  <!-- Loading indicator -->
  <app-qs-loading-state *ngIf="isLoading" class="mt-4" [isLoading]="isLoading"
    [algorithmUsed]="algorithmUsed"></app-qs-loading-state>

  <!-- No solution message -->
  <app-qs-no-solution-alert *ngIf="noSolution && !isLoading" [queensCount]="queensCount"></app-qs-no-solution-alert>

  <!-- Solution display - Two column layout -->
  <div *ngIf="solution && !isLoading" class="results-container">
    <div class="results-row">
      <div class="board-column"
        [class.full-width]="algorithmUsed === 'backtracking' || (algorithmUsed === 'ga' && evolutionHistory.length === 0) || (algorithmUsed === 'nn' && trainingHistory.length === 0) || (algorithmUsed === 'brain' && brainHistory.length === 0)">
        <app-qs-results-board [solution]="solution" [queensCount]="queensCount" [algorithmUsed]="algorithmUsed"
          [generations]="generations" [iterations]="iterations" [solveTime]="solveTime"></app-qs-results-board>
      </div>

      <app-qs-training-chart
        *ngIf="(algorithmUsed === 'ga' && evolutionHistory.length > 0) || (algorithmUsed === 'nn' && trainingHistory.length > 0) || (algorithmUsed === 'brain' && brainHistory.length > 0)"
        class="chart-column" [algorithmUsed]="algorithmUsed" [evolutionHistory]="evolutionHistory"
        [trainingHistory]="trainingHistory" [brainHistory]="brainHistory" [generations]="generations"
        [iterations]="iterations" [queensCount]="queensCount"></app-qs-training-chart>
    </div>
  </div>

  <!-- Campeões salvos de todos os algoritmos -->
  <app-qs-champions-table *ngIf="getAllChampions().length > 0" class="mt-4" [champions]="getAllChampions()"
    (viewSolution)="loadSavedSolution($event)" (clearAll)="clearAllResults()"></app-qs-champions-table>
</div>
