name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

# Opt every JavaScript action into Node.js 24 ahead of the GitHub-mandated
# 2026-06-02 cut-over. Removes the 'Node.js 20 actions are deprecated'
# warning emitted by checkout, setup-node, upload-artifact and
# pnpm/action-setup at v4. Drop this block once those actions ship a v5
# that defaults to Node 24.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Allow only one concurrent deployment, but never cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Lint, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Unit tests (Vitest)
        run: pnpm test --reporter=default

      - name: Build (production)
        run: pnpm build --configuration production

      - name: Bundle-size gate
        shell: bash
        run: |
          set -e
          MAIN=$(find dist/n-rainhas/browser -maxdepth 1 -name 'main-*.js' | head -1)
          if [ -z "$MAIN" ]; then
            echo "main-*.js not found"; exit 1
          fi
          SIZE=$(wc -c < "$MAIN")
          echo "Initial JS size (uncompressed): $SIZE bytes"
          if [ "$SIZE" -gt 1048576 ]; then
            echo "::warning::Initial bundle exceeds 1 MB uncompressed."
          fi

      - name: Upload dist as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/n-rainhas/browser
          retention-days: 7

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build --configuration production
      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.github/lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
        continue-on-error: true

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for GitHub Pages
        run: pnpm build --configuration production --base-href=/${{ github.event.repository.name }}/

      - name: SPA fallback (copy index.html to 404.html)
        shell: bash
        run: |
          cp dist/n-rainhas/browser/index.html dist/n-rainhas/browser/404.html

      - name: Disable Jekyll on GitHub Pages
        shell: bash
        run: touch dist/n-rainhas/browser/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/n-rainhas/browser

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
