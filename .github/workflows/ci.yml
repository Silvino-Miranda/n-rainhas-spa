name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build:
    name: Lint, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Unit tests (Vitest)
        run: pnpm test --reporter=default

      - name: Build (production)
        run: pnpm build --configuration production

      - name: Bundle-size gate
        shell: bash
        run: |
          set -e
          MAIN=$(find dist/n-rainhas/browser -maxdepth 1 -name 'main-*.js' | head -1)
          if [ -z "$MAIN" ]; then
            echo "main-*.js not found"; exit 1
          fi
          SIZE=$(wc -c < "$MAIN")
          echo "Initial JS size (uncompressed): $SIZE bytes"
          if [ "$SIZE" -gt 1048576 ]; then
            echo "::warning::Initial bundle exceeds 1 MB uncompressed."
          fi

      - name: Upload dist as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/n-rainhas/browser
          retention-days: 7

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build --configuration production
      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.github/lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
        continue-on-error: true
