# Local-only compose stack for testing the production image before pushing
# to a self-hosted cluster. Use:
#   docker compose up --build
# then open http://localhost:8080.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_HREF: /
    image: n-rainhas-spa:local
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
